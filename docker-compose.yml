services:
  overlay-coincoin:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      TURN_URLS: ${TURN_URLS}
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL}
      ICE_TRANSPORT_POLICY: ${ICE_TRANSPORT_POLICY:-all}
    restart: unless-stopped

  turn:
    profiles:
      - turn
    image: coturn/coturn:4.6.2
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --realm=${TURN_REALM}
      - --user=${TURN_USERNAME}:${TURN_CREDENTIAL}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped
